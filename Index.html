    window.onload = function() {
      const saved = localStorage.getItem('ma_abu_darrin_supervisi_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        } catch(e) {
          console.error("Gagal membaca saved state", e);
        }
      }
      
      // Wajib autentikasi Supabase; jangan gunakan akun contoh dari localStorage.
      appState.currentUser = null;
      showLoginScreen();
    };

    function saveState() {
      localStorage.setItem('ma_abu_darrin_supervisi_v2', JSON.stringify(appState));
    }

    function addAuditLog(action) {
      const log = {
        id: 'LOG-' + Date.now().toString().slice(-4),
        timestamp: new Date().toLocaleString('id-ID'),
        user: appState.currentUser ? appState.currentUser.name : 'System',
        action
      };
      appState.auditLogs.unshift(log);
      saveState();
    }

    function showToast(msg, type = 'success') {
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between text-xs font-semibold pointer-events-auto transition-all duration-300 transform translate-y-2`;
      toast.innerHTML = `<span><i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} mr-2"></i>${msg}</span>`;
      
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openRubricModal(itemId, isManagerial = false) {
      const source = isManagerial ? appState.instrumentsManagerial : appState.instrumentsAcademic;
      const item = source.find(i => i.id === itemId);
      if (!item) return;

      document.getElementById('modalRubricTitle').innerText = `${item.code} - ${item.name}`;
      document.getElementById('modalRubricCategory').innerText = `Kategori: ${item.category}`;

      const content = document.getElementById('modalRubricContent');
      content.innerHTML = `
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-4 bg-slate-100 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-200 dark:border-slate-600">
          <i class="fa-solid fa-circle-info text-brand-600 mr-1.5"></i>
          <strong>Deskripsi Indikator:</strong> ${item.description}
        </p>
        <div class="space-y-3">
          <div class="p-3 rounded-xl border border-red-200 dark:border-red-900/50 bg-red-50/50 dark:bg-red-950/20">
            <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300">Skor 1 - Kurang</span>
            <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed">${item.rubric[1]}</p>
          </div>

            <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-300">Skor 2 - Cukup</span>
            <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed">${item.rubric[2]}</p>
          </div>

            <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300">Skor 3 - Baik</span>

    // ===== Hak akses berbasis peran (UI). Kebijakan RLS Supabase tetap wajib dikonfigurasi di server. =====
    function currentRole() { return String(appState.currentUser?.role || "").toLowerCase(); }
    function isAdmin() { return ["admin", "administrator"].includes(currentRole()); }
    function isSupervisor() { return currentRole() === "supervisor"; }
    function isTeacher() { return currentRole() === "guru"; }
    function currentUserId() { return String(appState.currentUser?.id || ""); }
    function currentUserName() { return String(appState.currentUser?.name || ""); }
    function assignedTeacherIds() {
      const me = currentUserId();
      const name = currentUserName();
      const ids = new Set();
      (appState.mappings || []).forEach(m => {
        if (String(m.supervisorId || "") === me || String(m.supervisorName || "") === name) {
          (m.teacherIds || []).forEach(id => ids.add(String(id)));
        }
      });
      (appState.schedules || []).forEach(s => {
        if (String(s.supervisorId || "") === me || String(s.supervisorName || "") === name) {
          if (s.teacherId) ids.add(String(s.teacherId));
          const u = (appState.users || []).find(x => x.name === s.teacherName);
          if (u?.id) ids.add(String(u.id));
        }
      });
      return ids;
    }
    function isOwnTeacherRecord(record) {
      const u = appState.currentUser || {};
      return String(record.teacherId || record.user_id || record.ownerId || "") === String(u.id || "") ||
        String(record.teacherName || record.name || "") === String(u.name || "");
    }
    function assignedTeacherNames() {
      const names = new Set();
      const ids = assignedTeacherIds();
      (appState.users || []).forEach(u => { if (ids.has(String(u.id))) names.add(String(u.name)); });
      (appState.schedules || []).forEach(s => {
        if ((String(s.supervisorId || '') === currentUserId() || String(s.supervisorName || '') === currentUserName()) && s.teacherName) names.add(String(s.teacherName));
      });
      (appState.mappings || []).forEach(m => {
        if (String(m.supervisorId || '') === currentUserId() || String(m.supervisorName || '') === currentUserName()) {
          (m.teacherNames || []).forEach(n => names.add(String(n)));
          (m.teacherIds || []).forEach(id => { const u = (appState.users || []).find(x => String(x.id) === String(id)); if (u?.name) names.add(String(u.name)); });
        }
      });
      return names;
    }
    function isAssignedTeacherRecord(record) {
      const ids = assignedTeacherIds();
      if (record.teacherId && ids.has(String(record.teacherId))) return true;
      if (record.teacherName && assignedTeacherNames().has(String(record.teacherName))) return true;
      const u = (appState.users || []).find(x => x.name === record.teacherName);
      if (u?.id && ids.has(String(u.id))) return true;
      return (appState.mappings || []).some(m =>
        (String(m.supervisorId || "") === currentUserId() || String(m.supervisorName || "") === currentUserName()) &&
        ((m.teacherNames || []).includes(record.teacherName) || (m.teacherIds || []).some(id => {
          const teacher = (appState.users || []).find(x => String(x.id) === String(id));
          return teacher && teacher.name === record.teacherName;
        }))
      );
    }
    function scopedSchedules() {
      if (isAdmin()) return appState.schedules || [];
      if (isSupervisor()) return (appState.schedules || []).filter(s =>
        String(s.supervisorId || "") === currentUserId() || String(s.supervisorName || "") === currentUserName() || isAssignedTeacherRecord(s));

    async function uploadTeacherDocument() {
      if (!isTeacher()) return showToast("Hanya Guru yang dapat mengunggah melalui fitur ini.", "error");
      const file = document.getElementById('teacherDocFile')?.files?.[0];
      const title = document.getElementById('teacherDocTitle')?.value?.trim();
      const category = document.getElementById('teacherDocCategory')?.value || 'Dokumen';
      if (!file || !title) return showToast("Nama dan file dokumen wajib diisi.", "error");
      if (file.size > 15 * 1024 * 1024) return showToast("Ukuran file maksimal 15 MB.", "error");
      const { data: sessionData } = await sb.auth.getSession();
      if (!sessionData.session) return showToast("Sesi login tidak ditemukan. Silakan login kembali.", "error");
      const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${sessionData.session.user.id}/${Date.now()}-${cleanName}`;
      const { error: uploadError } = await sb.storage.from('teacher-documents').upload(path, file, { upsert: false });
      if (uploadError) return showToast("Upload gagal: " + uploadError.message, "error");
      appState.documents.unshift({ id: 'DOC-' + Date.now(), teacherId: currentUserId(), teacherName: currentUserName(), title, category, date: new Date().toISOString().slice(0,10), status: 'Menunggu Review', storagePath: path, fileName: file.name, uploadedBy: sessionData.session.user.id });
      saveState(); addAuditLog(`Mengunggah dokumen: ${title}`); renderApp(); showToast("Dokumen berhasil diunggah.");
    }
    async function openTeacherDocument(path) {
      if (!path || !(isAdmin() || isSupervisor() || isTeacher())) return showToast("Akses dokumen ditolak.", "error");
      const doc = (appState.documents || []).find(d => d.storagePath === path);
      if (isTeacher() && (!doc || !isOwnTeacherRecord(doc))) return showToast("Anda hanya dapat membuka dokumen milik sendiri.", "error");
      if (isSupervisor() && (!doc || !isAssignedTeacherRecord(doc))) return showToast("Dokumen bukan milik guru binaan Anda.", "error");
      const { data, error } = await sb.storage.from('teacher-documents').createSignedUrl(path, 60);
      if (error) return showToast("Tidak dapat membuka dokumen: " + error.message, "error");
      window.open(data.signedUrl, '_blank', 'noopener');
    }
    function reviewTeacherDocument(id, status) {
      if (!(isAdmin() || isSupervisor())) return showToast("Anda tidak berhak menilai dokumen.", "error");
      const d = (appState.documents || []).find(x => String(x.id) === String(id));

      if (isSupervisor() && !isAssignedTeacherRecord(d)) return showToast("Dokumen bukan milik guru binaan Anda.", "error");
      const notes = prompt("Catatan/revisi untuk Guru (boleh dikosongkan):", d.reviewNotes || "");
      if (notes === null) return;
      d.status = status; d.reviewNotes = notes.trim(); d.reviewedBy = currentUserName(); d.reviewedAt = new Date().toISOString();
      saveState(); addAuditLog(`Review dokumen ${d.title}: ${status}`); renderApp(); showToast("Review dokumen disimpan.");
    }

    function submitAcademicObservation() {
      if (!(isAdmin() || isSupervisor())) return showToast("Guru tidak berhak mengisi atau mengubah penilaian.", "error");
      const teacherName = document.getElementById('obsTeacher').value;
      const className = document.getElementById('obsClass').value;
      const subject = document.getElementById('obsSubject').value || 'Mata Pelajaran Umum';
      const date = document.getElementById('obsDate').value;
      const notes = document.getElementById('obsAcadNotes').value || 'PBM terlaksana dengan sangat tertib.';
      const rec = document.getElementById('obsAcadRec').value || 'Disarankan berbagi best practice.';

      const activeItems = appState.instrumentsAcademic.filter(i => i.active);
      const scores = {};
      let total = 0;

      activeItems.forEach(item => {
        const selected = document.querySelector(`input[name="score_acad_${item.id}"]:checked`);
        const val = selected ? parseInt(selected.value) : 4;
        scores[item.id] = val;
        total += val;
      });

      const maxScore = activeItems.length * 4;
      const pct = parseFloat(((total / maxScore) * 100).toFixed(1));

      const selectedTeacher = (appState.users || []).find(u => u.name === teacherName);
      if (isSupervisor() && !assignedTeacherIds().has(String(selectedTeacher?.id || ''))) return showToast("Guru ini bukan guru binaan Anda.", "error");
      const newResult = {
        id: 'RES-ACAD-' + Date.now().toString().slice(-4),
        teacherId: selectedTeacher?.id || null,
        teacherName,
        supervisorName: appState.currentUser.name,
        date,
        class: className,
        subject,
        scores,
        totalScore: total,
        maxScore,
        percentage: pct,
        grade: pct >= 86 ? 'Sangat Baik (A)' : 'Baik (B)',
        notes,
        recommendation: rec,
        rtl: 'Penyusunan instrumen evaluasi lanjutan.',
        signatures: { supervisor: true, teacher: true }
      };

      appState.academicResults.unshift(newResult);
      saveState();
      addAuditLog(`Menambahkan Laporan Supervisi Akademik: ${teacherName}`);
      showToast("Laporan Supervisi Akademik berhasil disimpan!");
      navigate('reports');
    }

    function bulkVisibleRows(type) {

    function openBulkDataEditor(type, focusId='') {
      if (!BULK_FIELDS[type]) return showToast('Jenis data ini belum mendukung formulir massal.', 'error');
      if(type==='mappings' && !isAdmin()) return showToast('Pemetaan hanya dapat diubah Admin.', 'error');
      if(type==='schedules' && !(isAdmin()||isSupervisor())) return showToast('Akses ditolak.', 'error');
      if(['documents','academicResults','managerialResults'].includes(type) && !(isAdmin()||isSupervisor())) return showToast('Akses ditolak.', 'error');
      const rows=bulkVisibleRows(type).map((r,i)=> type==='classes' ? ({id:`CLASS-${i+1}`,value:r}) : ({...r}));
      if(focusId && !rows.some(r=>String(r.id)===String(focusId))) return showToast('Data tidak ditemukan atau tidak masuk cakupan akses Anda.', 'error');
      const fields=BULK_FIELDS[type];

      const rowsHtml=rows.map((r,i)=>`<tr data-bulk-row="${i}"><td class="p-2 border-b text-xs font-mono">${escHtml(r.id||'BARU')}</td>${fields.map(([key,label])=>fieldInput(r,i,key,label)).join('')}<td class="p-2 border-b"><button onclick="removeBulkRow(this)" class="px-2 py-1 rounded bg-red-50 text-red-700 text-xs">Hapus</button></td></tr>`).join('');
      const modal=document.createElement('div'); modal.id='bulkDataModal'; modal.className='fixed inset-0 z-[100] bg-slate-950/70 p-3 md:p-8 flex items-center justify-center';
      modal.innerHTML=`<section class="bg-white rounded-2xl shadow-2xl w-full max-w-[96vw] max-h-[92vh] flex flex-col overflow-hidden"><header class="p-5 border-b flex items-start justify-between gap-3"><div><h3 class="font-bold text-lg text-slate-900">Form Massal: ${BULK_LABELS[type]}</h3><p class="text-xs text-slate-500 mt-1">Isi atau ubah banyak baris sekaligus, lalu simpan sekali. Kolom ID otomatis untuk data baru.</p></div><button onclick="closeBulkDataEditor()" class="px-3 py-2 rounded-lg bg-slate-100 text-slate-700">Tutup</button></header><div class="p-4 flex flex-wrap gap-2 border-b"><button onclick="addBulkRow()" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>Tambah Baris</button><span class="text-xs text-slate-500 self-center">${rows.length} baris saat ini • kolom dapat digeser ke samping</span></div><div class="overflow-auto flex-1"><table class="min-w-full border-collapse"><thead class="sticky top-0 bg-slate-100"><tr><th class="p-2 text-left text-xs">ID</th>${fields.map(([k,l])=>`<th class="p-2 text-left text-xs whitespace-nowrap">${escHtml(l)}</th>`).join('')}<th class="p-2 text-left text-xs">Aksi</th></tr></thead><tbody id="bulkDataRows">${rowsHtml}</tbody></table></div><footer class="p-4 border-t flex justify-between items-center gap-3"><p class="text-[11px] text-slate-500">Simpan akan menerapkan seluruh perubahan dalam formulir ini.</p><div class="flex gap-2"><button onclick="closeBulkDataEditor()" class="px-4 py-2 rounded-lg border text-xs font-bold">Batal</button><button onclick="saveBulkDataEditor('${type}')" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan Semua</button></div></footer></section>`;
      modal.dataset.type=type; modal.dataset.fields=JSON.stringify(fields); modal.dataset.rows=JSON.stringify(rows); document.body.appendChild(modal);
    }
    function addBulkRow() {
      const modal=document.getElementById('bulkDataModal'); if(!modal) return;
      const type=modal.dataset.type, fields=JSON.parse(modal.dataset.fields), tbody=document.getElementById('bulkDataRows');
      const idx=`new-${Date.now()}-${Math.random().toString(36).slice(2,6)}`; const row=type==='classes'?{value:''}:{};
      const tr=document.createElement('tr'); tr.dataset.bulkRow=String(idx);
      tr.innerHTML=`<td class="p-2 border-b text-xs font-mono">BARU</td>${fields.map(([key,label])=>`<td class="p-1 border-b align-top"><input data-bulk-index="${idx}" data-bulk-key="${key}" aria-label="${label}" class="w-full min-w-32 border border-slate-300 rounded-md px-2 py-2 text-xs text-slate-800 bg-white" value="" placeholder="${escHtml(label)}"></td>`).join('')}<td class="p-2 border-b"><button onclick="removeBulkRow(this)" class="px-2 py-1 rounded bg-red-50 text-red-700 text-xs">Hapus</button></td>`; tbody.appendChild(tr);
    }
    function removeBulkRow(btn) { btn.closest('tr')?.remove(); }
    function closeBulkDataEditor() { document.getElementById('bulkDataModal')?.remove(); }
    function saveBulkDataEditor(type) {
      const modal=document.getElementById('bulkDataModal'); if(!modal || modal.dataset.type!==type) return;
      const fields=JSON.parse(modal.dataset.fields), original=JSON.parse(modal.dataset.rows), trs=[...document.querySelectorAll('#bulkDataRows tr')];
      const oldById=new Map(original.map(r=>[String(r.id||''),r]));
      const updated=[];
      for(const tr of trs) {
        const inputs=[...tr.querySelectorAll('input[data-bulk-key]')], obj={}; inputs.forEach(inp=>obj[inp.dataset.bulkKey]=inp.value.trim());
        if(!Object.values(obj).some(Boolean)) continue;
        const rowIndex=Number(tr.dataset.bulkRow); const old=Number.isInteger(rowIndex) ? oldById.get(String(original[rowIndex]?.id||'')) : undefined;
        if(type==='classes') { updated.push(obj.value); continue; }
        const id=old?.id || `${type.toUpperCase()}-${Date.now()}-${updated.length+1}`;
        const row={...(old||{}),...obj,id};
        if(type==='mappings') {
          const supervisor=(appState.users||[]).find(u=>String(u.id).toLowerCase()===String(row.supervisorId||'').toLowerCase());
          if(row.supervisorId && !supervisor) return showToast(`ID Supervisor tidak ditemukan: ${row.supervisorId}`,'error');
          row.supervisorName=supervisor?.name || row.supervisorName || '';
          const raw=String(row.teacherIds||''); row.teacherIds=[...new Set(raw.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean))];
          const valid=new Set((appState.users||[]).filter(u=>u.role==='Guru').map(u=>String(u.id).toLowerCase()));
          const invalid=row.teacherIds.filter(x=>!valid.has(String(x).toLowerCase())); if(invalid.length) return showToast(`ID Guru tidak ditemukan: ${invalid.join(', ')}`,'error');
        }
        if(type==='schedules' && isSupervisor() && !(String(row.supervisorId||'')===currentUserId() || String(row.supervisorName||'')===currentUserName() || isAssignedTeacherRecord(row))) return showToast('Supervisor hanya boleh menyimpan jadwal dalam cakupan binaannya.','error');
        if(type==='academicResults') { row.percentage=Number(String(row.percentage||0).replace('%','').replace(',','.'))||0; row.scores=old?.scores||{}; row.signatures=old?.signatures||{supervisor:false,teacher:false}; }
        if(type==='managerialResults') { row.percentage=Number(String(row.percentage||0).replace('%','').replace(',','.'))||0; row.scores=old?.scores||{}; }
        updated.push(row);
      }
      if(type==='classes') appState.classes=[...new Set(updated.filter(Boolean))];
      else {
        const visibleIds=new Set(original.map(r=>String(r.id||'')));
        const base=(appState[type]||[]).filter(r=>!visibleIds.has(String(r.id||'')));
        appState[type]=[...base,...updated];
      }
      saveState(); addAuditLog(`Form massal: ${BULK_LABELS[type]} (${updated.length} baris disimpan)`); closeBulkDataEditor(); renderApp(); showToast(`${updated.length} baris ${BULK_LABELS[type]} berhasil disimpan.`);

    // Admin membuat akun melalui Edge Function. Password tidak pernah disimpan di browser/localStorage.
    async function openAddUserModal() {
      if (!appState.currentUser || !isAdmin()) return showToast("Hanya Admin yang dapat membuat pengguna.", "error");
      document.getElementById('createUserFormModal')?.remove();
      const modal=document.createElement('div'); modal.id='createUserFormModal'; modal.className='fixed inset-0 z-[100] bg-slate-950/70 p-4 flex items-center justify-center';
      modal.innerHTML=`<section class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden"><header class="p-5 border-b flex items-center justify-between"><div><h3 class="font-bold text-lg text-slate-900">Tambah Pengguna Baru</h3><p class="text-xs text-slate-500 mt-1">Isi seluruh data dalam satu formulir.</p></div><button onclick="document.getElementById('createUserFormModal').remove()" class="px-3 py-2 bg-slate-100 rounded-lg text-sm">Tutup</button></header><form id="createUserForm" onsubmit="submitUserCreateForm(event)" class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-xs font-bold mb-1">ID Login *</label><input name="user_id" required class="w-full border rounded-lg p-3 text-sm" placeholder="GURU003" autocomplete="off"></div><div><label class="block text-xs font-bold mb-1">Nama Lengkap *</label><input name="full_name" required class="w-full border rounded-lg p-3 text-sm" placeholder="Nama lengkap"></div><div><label class="block text-xs font-bold mb-1">Role *</label><select name="role" required class="w-full border rounded-lg p-3 text-sm"><option value="Guru">Guru</option><option value="Supervisor">Supervisor</option></select></div><div><label class="block text-xs font-bold mb-1">Password Awal * (min. 8 karakter)</label><input name="password" type="password" minlength="8" required class="w-full border rounded-lg p-3 text-sm" autocomplete="new-password"></div><div><label class="block text-xs font-bold mb-1">NIP</label><input name="nip" class="w-full border rounded-lg p-3 text-sm" placeholder="Opsional"></div><div><label class="block text-xs font-bold mb-1">Mata Pelajaran</label><input name="subject" class="w-full border rounded-lg p-3 text-sm" placeholder="Untuk Guru (opsional)"></div><div class="md:col-span-2 flex justify-end gap-2 pt-2"><button type="button" onclick="document.getElementById('createUserFormModal').remove()" class="px-4 py-2 rounded-lg border text-sm">Batal</button><button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 text-white text-sm font-bold">Buat Akun</button></div></form></section>`;
      document.body.appendChild(modal);
    }
    async function submitUserCreateForm(event) {
      event.preventDefault();
      if (!isAdmin()) return showToast('Hanya Admin yang dapat membuat pengguna.', 'error');
      const form=event.currentTarget, fd=new FormData(form);
      const userId=String(fd.get('user_id')||'').trim(), fullName=String(fd.get('full_name')||'').trim(), role=String(fd.get('role')||''), password=String(fd.get('password')||''), nip=String(fd.get('nip')||'').trim(), subject=String(fd.get('subject')||'').trim();
      if(!userId || !fullName || !['Supervisor','Guru'].includes(role) || password.length<8) return showToast('Periksa kembali isian wajib. Password minimal 8 karakter.', 'error');
      const submit=form.querySelector('button[type="submit"]'); submit.disabled=true; submit.textContent='Menyimpan...';
      try {
        const { data: sess } = await sb.auth.getSession();
        if(!sess.session) throw new Error('Sesi admin tidak ditemukan. Silakan login kembali.');
        const response = await fetch(`${SUPABASE_URL}/functions/v1/manage-user`, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${sess.session.access_token}`,'apikey':SUPABASE_ANON_KEY}, body:JSON.stringify({action:'create',user_id:userId,full_name:fullName,role,password,nip,subject:role==='Guru'?subject:''}) });
        const result=await response.json(); if(!response.ok) throw new Error(result.error||'Gagal membuat akun.');
        await loadProfiles(); saveState(); document.getElementById('createUserFormModal')?.remove(); renderApp(); showToast(`Akun ${userId} berhasil dibuat dan disimpan ke Supabase.`);
      } catch(err) { console.error(err); showToast('Gagal membuat pengguna: '+err.message,'error'); submit.disabled=false; submit.textContent='Buat Akun'; }
    }

    async function resetPassword(userId) {
      if (!appState.currentUser || !isAdmin()) return showToast("Hanya Admin yang dapat mereset password.", "error");
      const password = prompt("Masukkan password baru (minimal 8 karakter):");
      if (!password || password.length < 8) return showToast("Password minimal 8 karakter.", "error");
      try {
        const { data: sess } = await sb.auth.getSession();
        const response = await fetch(`${SUPABASE_URL}/functions/v1/manage-user`, {
          method: "POST",
          headers: { "Content-Type":"application/json", "Authorization":`Bearer ${sess.session.access_token}`, "apikey":SUPABASE_ANON_KEY },
          body: JSON.stringify({ action:"reset_password", user_id:userId, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Reset password gagal.");
        showToast("Password berhasil diubah di Supabase.");
      } catch (err) { showToast("Reset password gagal: " + err.message, "error"); }
    }

    // Data tidak lagi otomatis login sebagai Admin contoh dari localStorage.
    window.onload = async function() {
      if (window.supabase && SUPABASE_URL.startsWith("https://") &&
          !SUPABASE_URL.includes("GANTI-PROJECT") &&
          SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes("GANTI_DENGAN")) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supabaseReady = true;
        const { data } = await sb.auth.getSession();
        if (data.session) {
          try {
            const { data: profile, error } = await sb.from("profiles")
              .select("id,user_id,full_name,role,nip,subject,active")
              .eq("id", data.session.user.id).maybeSingle();
            if (error) throw error;
            if (!profile || !profile.active) throw new Error("Profil tidak ditemukan atau tidak aktif.");
            appState.currentUser = profileToAppUser(profile);
            await loadSupabaseState();
            await loadProfiles();
            appState.currentUser = profileToAppUser(profile);
            renderApp();
            return;
          } catch (e) {
            console.error(e); await sb.auth.signOut(); showLoginScreen(e.message);
            return;
          }
        }
      }
      showLoginScreen();
    };

    // Menampilkan error jika koneksi Supabase belum disetel.
    window.addEventListener("unhandledrejection", e => {
      console.error("Kesalahan aplikasi:", e.reason);
    });
  </script>

</body>
</html>
