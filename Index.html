    window.onload = function() {
      const saved = localStorage.getItem('ma_abu_darrin_supervisi_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        } catch(e) {
          console.error("Gagal membaca saved state", e);
        }
      }
      
      if (!appState.currentUser) {
        appState.currentUser = appState.users[0]; // Default login Admin
      }

      renderApp();
    };

    function saveState() {
      localStorage.setItem('ma_abu_darrin_supervisi_v2', JSON.stringify(appState));
    }

    function addAuditLog(action) {
      const log = {
        id: 'LOG-' + Date.now().toString().slice(-4),
        timestamp: new Date().toLocaleString('id-ID'),
        user: appState.currentUser ? appState.currentUser.name : 'System',
        action
      };
      appState.auditLogs.unshift(log);
      saveState();
    }

    function showToast(msg, type = 'success') {
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between text-xs font-semibold pointer-events-auto transition-all duration-300 transform translate-y-2`;
      toast.innerHTML = `<span><i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} mr-2"></i>${msg}</span>`;
      
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openRubricModal(itemId, isManagerial = false) {
      const source = isManagerial ? appState.instrumentsManagerial : appState.instrumentsAcademic;
      const item = source.find(i => i.id === itemId);
      if (!item) return;

      document.getElementById('modalRubricTitle').innerText = `${item.code} - ${item.name}`;
      document.getElementById('modalRubricCategory').innerText = `Kategori: ${item.category}`;

      const content = document.getElementById('modalRubricContent');
      content.innerHTML = `
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-4 bg-slate-100 dark:bg-slate-700/50 p-3 rounded-xl border border-slate-200 dark:border-slate-600">

          <strong>Deskripsi Indikator:</strong> ${item.description}

        <div class="space-y-3">
          <div class="p-3 rounded-xl border border-red-200 dark:border-red-900/50 bg-red-50/50 dark:bg-red-950/20">

            <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed">${item.rubric[1]}</p>
          </div>

            <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-300">Skor 2 - Cukup</span>
            <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed">${item.rubric[2]}</p>

          <div class="p-3 rounded-xl border border-blue-200 dark:border-blue-900/50 bg-blue-50/50 dark:bg-blue-950/20">
            <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300">Skor 3 - Baik</span>
            <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed">${item.rubric[3]}</p>

          </div>
        </div>

      appState.activeMenu = menu;

      const u = appState.users.find(x => x.id === userId);
      if (u) {
        appState.currentUser = u;
        addAuditLog(`Beralih sesi akun ke: ${u.name} (${u.role})`);
        showToast(`Login sebagai ${u.name} (${u.role})`);
        renderApp();

    function getMenuTitle(menu) {
      const titles = {
        'dashboard': 'Dashboard Supervisi V2',

        'schedules': 'Jadwal & Kalender Observasi',
        'documents': 'Bank Dokumen & Modul Ajar Guru',
        'supervise_academic': 'Formulir Observasi Supervisi Akademik',
        'supervise_managerial': 'Formulir Evaluasi Supervisi Manajerial Tendik',
        'rtl': 'Rencana Tindak Lanjut & Program PKB',
        'reports': 'Pusat Laporan & Cetak Berita Acara',
        'settings': 'Pengaturan Sistem & Generator RLS Supabase SQL'
      };
      return titles[menu] || 'Supervisi MA Abu Darrin';
    }

    function submitAcademicObservation() {
      const teacherName = document.getElementById('obsTeacher').value;
      const className = document.getElementById('obsClass').value;
      const subject = document.getElementById('obsSubject').value || 'Mata Pelajaran Umum';
      const date = document.getElementById('obsDate').value;
      const notes = document.getElementById('obsAcadNotes').value || 'PBM terlaksana dengan sangat tertib.';
      const rec = document.getElementById('obsAcadRec').value || 'Disarankan berbagi best practice.';

      const activeItems = appState.instrumentsAcademic.filter(i => i.active);
      const scores = {};
      let total = 0;

      activeItems.forEach(item => {
        const selected = document.querySelector(`input[name="score_acad_${item.id}"]:checked`);
        const val = selected ? parseInt(selected.value) : 4;
        scores[item.id] = val;
        total += val;
      });

      const maxScore = activeItems.length * 4;
      const pct = parseFloat(((total / maxScore) * 100).toFixed(1));

      const newResult = {
        id: 'RES-ACAD-' + Date.now().toString().slice(-4),
        teacherName,
        supervisorName: appState.currentUser.name,
        date,
        class: className,
        subject,
        scores,
        totalScore: total,
        maxScore,
        percentage: pct,
        grade: pct >= 86 ? 'Sangat Baik (A)' : 'Baik (B)',
        notes,
        recommendation: rec,
        rtl: 'Penyusunan instrumen evaluasi lanjutan.',
        signatures: { supervisor: true, teacher: true }
      };

      appState.academicResults.unshift(newResult);
      saveState();
      addAuditLog(`Menambahkan Laporan Supervisi Akademik: ${teacherName}`);
      showToast("Laporan Supervisi Akademik berhasil disimpan!");
      navigate('reports');
    }

CREATE TABLE public.supervision_results (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  teacher_id TEXT NOT NULL,
  supervisor_id TEXT NOT NULL,
  academic_year TEXT DEFAULT '2026/2027',
  scores JSONB NOT NULL,
  total_score INT NOT NULL,
  percentage NUMERIC(5,2) NOT NULL,
  grade TEXT NOT NULL,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- Enable Row Level Security (RLS)
ALTER TABLE public.supervision_results ENABLE ROW LEVEL SECURITY;

-- Policy 1: Admin Full Access
CREATE POLICY "Admin Full Access" ON public.supervision_results
FOR ALL USING (auth.jwt() ->> 'role' = 'Admin');

-- Policy 2: Teacher Can Only View Own Results
CREATE POLICY "Teacher View Own" ON public.supervision_results
FOR SELECT USING (auth.jwt() ->> 'sub' = teacher_id);</code></pre>

    function copySqlCode() {
      const sqlText = `-- Schema RLS Supabase MA Abu Darrin TP 2026/2027\nCREATE TABLE public.supervision_results (...);`;

    function exportJSONV2() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `Supervisi_V2_MA_Abu_Darrin_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      showToast("Export backup JSON V2 berhasil!");
    }

    function exportExcelV2() {
      const wb = XLSX.utils.book_new();
      const wsData = appState.academicResults.map(r => ({
        Tanggal: r.date,
        Guru: r.teacherName,
        Kelas: r.class,
        Mapel: r.subject,
        Supervisor: r.supervisorName,
        Persentase: `${r.percentage}%`,
        Predikat: r.grade,
        Catatan: r.notes
      }));
      const ws = XLSX.utils.json_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "Akademik V2");
      XLSX.writeFile(wb, `Laporan_Supervisi_V2_MA_Abu_Darrin.xlsx`);
      showToast("Laporan Excel V2 diunduh!");
